services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:3-management
        volumes:
            - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
            - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            - RABBITMQ_DEFAULT_USER=admin
            - RABBITMQ_DEFAULT_PASS=password
        command: >
            bash -c "rabbitmq-server"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    nhl-game-monitor:
        build:
            context: ../nhl-game-monitor-net/nhl-game-monitor
            dockerfile: Dockerfile
        depends_on:
            rabbitmq:
                condition: service_healthy
        ports:
            - "5000:8080"
        volumes:
            - nhl-game-monitor-data:/app/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:8080/health > /dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    nhl-stats-service:
        build:
            context: ../nhl-stats-service-java
            dockerfile: Dockerfile
        depends_on:
            rabbitmq:
                condition: service_healthy
            opensearch:
                condition: service_healthy
        ports:
            - "8080:8080"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:8080/api/health > /dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s

    opensearch:
        image: opensearchproject/opensearch:2.19.1
        container_name: opensearch
        environment:
            - discovery.type=single-node
            - OPENSEARCH_INITIAL_ADMIN_PASSWORD=NhlStats2026!
            - plugins.security.disabled=true
            - network.host=0.0.0.0
            - bootstrap.memory_lock=true
            - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
        ulimits:
            memlock:
                soft: -1
                hard: -1
        ports:
            - "9200:9200"
            - "9600:9600"
        volumes:
            - opensearch-data:/usr/share/opensearch/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS http://localhost:9200/_cluster/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s

    opensearch-dashboards:
        image: opensearchproject/opensearch-dashboards:2.19.1
        container_name: opensearch-dashboards
        ports:
            - "5601:5601"
        environment:
            OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
            DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
        depends_on:
            opensearch:
                condition: service_healthy

    nhl-stats-ui:
        profiles:
            - prod
        build:
            context: ../nhl-stats-ui-react
            dockerfile: Dockerfile
        container_name: nhl-stats-ui
        ports:
            - "5173:80"
        depends_on:
            nhl-stats-service:
                condition: service_healthy

    nhl-stats-ui-dev:
        profiles:
            - dev
        build:
            context: ../nhl-stats-ui-react
            dockerfile: Dockerfile.dev
        container_name: nhl-stats-ui-dev
        ports:
            - "5173:5173"
        volumes:
            - ../nhl-stats-ui-react:/app
            - /app/node_modules
        environment:
            - CHOKIDAR_USEPOLLING=true
        depends_on:
            nhl-stats-service:
                condition: service_healthy

volumes:
    nhl-game-monitor-data:
    opensearch-data:
